<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do App</title>
  <style>
    :root {
      --bg: #eef2ff;
      --card: #ffffff;
      --text: #2c3e50;
      --muted: #636e72;
      --primary: #5c6ac4;
      --primary-hover: #4a56b2;
      --danger: #e74c3c;
      --danger-hover: #c0392b;
      --border: rgba(92, 106, 196, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, #f5f7ff 0%, var(--bg) 45%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
    }

    .container {
      width: min(420px, 100%);
      background: var(--card);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(44, 62, 80, 0.1);
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    .header {
      padding: 32px 28px 24px;
      background: linear-gradient(180deg, rgba(92,106,196,0.12), transparent);
    }

    .header h1 {
      margin: 0 0 12px;
      font-size: 1.9rem;
      letter-spacing: -0.03em;
    }

    .header p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .task-form {
      display: grid;
      gap: 12px;
      padding: 24px 28px 0;
    }

    .task-form input,
    .task-form button {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
    }

    .task-form input {
      border: 1px solid var(--border);
      background: #fff;
    }

    .task-form input:focus {
      border-color: rgba(92, 106, 196, 0.45);
    }

    .task-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .task-meta span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .task-form input:focus {
      border-color: rgba(92, 106, 196, 0.45);
    }

    .task-form button {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 16px;
      background: var(--primary);
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .task-form button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 18px 28px 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .task-list {
      list-style: none;
      margin: 0;
      padding: 0 28px 24px;
    }

    .task-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 14px 16px;
      border-radius: 18px;
      background: #f8f9ff;
      border: 1px solid rgba(92, 106, 196, 0.08);
      margin-top: 14px;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .task-item:hover {
      transform: translateY(-1px);
      background: #f4f5ff;
    }

    .task-item.completed {
      opacity: 0.78;
    }

    .task-item span {
      display: block;
      word-break: break-word;
      cursor: pointer;
    }

    .task-item.completed span {
      text-decoration: line-through;
      color: var(--muted);
    }

    .delete {
      border: none;
      background: var(--danger);
      color: white;
      padding: 10px 14px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .delete:hover {
      background: var(--danger-hover);
      transform: translateY(-1px);
    }

    .footer {
      padding: 0 28px 28px;
    }

    .clear-all {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(231, 76, 60, 0.2);
      background: transparent;
      color: var(--danger);
      border-radius: 16px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .clear-all:hover {
      background: rgba(231, 76, 60, 0.08);
    }

    @media (max-width: 380px) {
      .container {
        width: 100%;
        border-radius: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="header">
      <h1>Professional To-Do App</h1>
      <p>Track your tasks with a clean interface, save progress automatically, and manage completion in one place.</p>
    </section>

    <form class="task-form" id="taskForm">
      <input type="text" id="taskInput" placeholder="Add a new task" autocomplete="off" />
      <input type="datetime-local" id="taskTime" />
      <button type="submit">Add Task</button>
    </form>

    <div class="status">
      <span id="taskCount">0 tasks</span>
      <span id="completedCount">0 completed</span>
    </div>

    <ul id="taskList" class="task-list"></ul>

    <div class="footer">
      <button id="clearAll" class="clear-all">Clear All Tasks</button>
    </div>
  </div>

  <script>
    const taskForm = document.getElementById('taskForm');
    const taskInput = document.getElementById('taskInput');
    const taskTime = document.getElementById('taskTime');
    const taskList = document.getElementById('taskList');
    const taskCount = document.getElementById('taskCount');
    const completedCount = document.getElementById('completedCount');
    const clearAllButton = document.getElementById('clearAll');

    let tasks = JSON.parse(localStorage.getItem('todoTasks') || '[]');
    let alarmTimers = new Map();
    let audioCtx = null;

    function saveTasks() {
      localStorage.setItem('todoTasks', JSON.stringify(tasks));
    }

    function ensureTaskIds() {
      let changed = false;
      tasks = tasks.map(task => {
        if (!task.id) {
          changed = true;
          return { ...task, id: Date.now() + Math.random() };
        }
        return task;
      });
      if (changed) saveTasks();
    }

    function ensureAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function resumeAudioContext() {
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function requestNotificationPermission() {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    function playAlarmSound() {
      const ctx = ensureAudioContext();
      resumeAudioContext();
      const gain = ctx.createGain();
      gain.gain.value = 0.14;
      gain.connect(ctx.destination);
      const ringDuration = 3200;
      const interval = 380;
      const beeps = Math.floor(ringDuration / interval);
      let count = 0;

      const beep = () => {
        const oscillator = ctx.createOscillator();
        oscillator.type = 'square';
        oscillator.frequency.value = 880 + (count % 3) * 80;
        oscillator.connect(gain);
        oscillator.start();
        oscillator.stop(ctx.currentTime + 0.18);
        count += 1;
        if (count >= beeps) {
          clearInterval(ringInterval);
        }
      };

      const ringInterval = setInterval(beep, interval);
      beep();
    }

    function showAlarmNotification(title, message) {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(title, { body: message });
      } else {
        alert(`${title}: ${message}`);
      }
    }

    function scheduleAlarm(task) {
      if (!task.dueTime || task.completed) return;
      if (!task.id) task.id = Date.now() + Math.random();

      const due = new Date(task.dueTime);
      if (Number.isNaN(due.getTime())) return;

      const now = Date.now();
      const remaining = due.getTime() - now;
      if (remaining <= 0) return;

      const existingTimer = alarmTimers.get(task.id);
      if (existingTimer) {
        clearTimeout(existingTimer);
      }

      const timerId = setTimeout(() => {
        const currentTask = tasks.find(t => t.id === task.id);
        if (currentTask && !currentTask.completed) {
          playAlarmSound();
          showAlarmNotification('Task Reminder', `Time to complete: ${currentTask.text}`);
        }
      }, remaining);

      alarmTimers.set(task.id, timerId);
    }

    function clearAlarms() {
      alarmTimers.forEach(timerId => clearTimeout(timerId));
      alarmTimers.clear();
    }

    function updateSummary() {
      const total = tasks.length;
      const completed = tasks.filter(task => task.completed).length;

      taskCount.textContent = `${total} task${total === 1 ? '' : 's'}`;
      completedCount.textContent = `${completed} completed`;
    }

    function renderTasks() {
      taskList.innerHTML = '';
      clearAlarms();
      ensureTaskIds();

      tasks.forEach((task, index) => {
        const item = document.createElement('li');
        item.className = `task-item${task.completed ? ' completed' : ''}`;

        const text = document.createElement('span');
        text.textContent = task.text;
        text.addEventListener('click', () => toggleTaskCompletion(index));

        const meta = document.createElement('div');
        meta.className = 'task-meta';

        const statusText = document.createElement('span');
        statusText.textContent = task.completed ? 'Done' : 'Pending';

        meta.appendChild(statusText);

        if (task.dueTime) {
          const dueText = document.createElement('span');
          const dueDate = new Date(task.dueTime);
          dueText.textContent = `Due: ${dueDate.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}`;
          meta.appendChild(dueText);
        }

        const details = document.createElement('div');
        details.appendChild(text);
        details.appendChild(meta);

        const removeButton = document.createElement('button');
        removeButton.className = 'delete';
        removeButton.textContent = 'Delete';
        removeButton.addEventListener('click', () => removeTask(index));

        item.appendChild(details);
        item.appendChild(removeButton);
        taskList.appendChild(item);

        scheduleAlarm(task);
      });

      updateSummary();
    }

    function addTask(text, dueTime) {
      const trimmed = text.trim();
      if (!trimmed) return;

      tasks.push({ id: Date.now() + Math.random(), text: trimmed, completed: false, dueTime: dueTime || '' });
      saveTasks();
      renderTasks();
    }

    function toggleTaskCompletion(index) {
      tasks[index].completed = !tasks[index].completed;
      saveTasks();
      renderTasks();
    }

    function removeTask(index) {
      tasks.splice(index, 1);
      saveTasks();
      renderTasks();
    }

    function clearAllTasks() {
      if (tasks.length === 0) return;
      if (confirm('Are you sure you want to remove all tasks?')) {
        tasks = [];
        saveTasks();
        renderTasks();
      }
    }

    taskForm.addEventListener('submit', event => {
      event.preventDefault();
      ensureAudioContext();
      resumeAudioContext();
      addTask(taskInput.value, taskTime.value);
      taskInput.value = '';
      taskTime.value = '';
      taskInput.focus();
    });

    clearAllButton.addEventListener('click', clearAllTasks);
    document.addEventListener('click', resumeAudioContext, { once: true });

    requestNotificationPermission();
    renderTasks();
  </script>
</body>
</html>
